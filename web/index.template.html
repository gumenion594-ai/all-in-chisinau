<title>All in Chișinău</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/*__MAPLIBRE_CSS__*/
/* Layout: full-bleed map; a floating control sheet on the left (bottom sheet on phones). */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1b2230; --muted: #5d6676; --rule: #dde1e8;
  --accent: #0b5cad;      /* Chișinău coat-of-arms blue */
  --gold: #c8962e;        /* heraldic gold for the active state */
  --map-bg: #f2efe9; --map-water: #8fbde6; --map-road: #ffffff; --map-road-minor: #f7f7f7; --map-rail: #8b8f99; --map-line: #6b7280;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 8px 28px rgba(20, 30, 50, .16);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151c; --surface: #1a1f29; --fg: #e8ebf1; --muted: #9aa3b2; --rule: #2c3340; --accent: #5aa2ec; --gold: #e0b45a;
  --map-bg: #161a21; --map-water: #1f4466; --map-road: #3a404c; --map-road-minor: #2a2f38; --map-rail: #6d7380; --map-line: #8a93a3;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #1a1f29; --fg: #e8ebf1; --muted: #9aa3b2; --rule: #2c3340; --accent: #5aa2ec; --gold: #e0b45a;
  --map-bg: #161a21; --map-water: #1f4466; --map-road: #3a404c; --map-road-minor: #2a2f38; --map-rail: #6d7380; --map-line: #8a93a3;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
#map { position: absolute; inset: 0; }
.maplibregl-ctrl-group { background: var(--surface); }
.maplibregl-ctrl-group button + button { border-top-color: var(--rule); }
.maplibregl-ctrl-icon { filter: var(--icon-filter, none); }
:root[data-theme="dark"] .maplibregl-ctrl-icon { filter: invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .maplibregl-ctrl-icon { filter: invert(1); } }
.maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); }
.maplibregl-popup-content { background: var(--surface); color: var(--fg); border-radius: 10px; font: 13px/1.45 var(--body); box-shadow: var(--shadow); }
.maplibregl-popup-tip { border-top-color: var(--surface) !important; border-bottom-color: var(--surface) !important; }
.maplibregl-popup-close-button { color: var(--muted); }
.maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted); }
.maplibregl-ctrl-attrib a { color: var(--muted); }

#panel {
  position: absolute; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
  width: 350px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: var(--shadow); overflow: hidden;
}
header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 16px; border-bottom: 1px solid var(--rule); }
.crest { width: 26px; height: 30px; flex: none; }
header h1 { font: 800 17px/1.1 var(--display); letter-spacing: .01em; margin: 0; flex: 1; text-wrap: balance; }
header h1 small { display: block; font: 500 10.5px/1.3 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.iconbtn { border: 1px solid var(--rule); background: transparent; color: var(--fg); border-radius: 8px; height: 30px; min-width: 34px;
  font: 700 12px var(--display); letter-spacing: .06em; cursor: pointer; }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
#collapse { display: none; }
nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--rule); }
.tab { border: 0; background: transparent; color: var(--muted); padding: 9px 1px 8px; font: 600 10.5px/1.2 var(--body); min-width: 0; overflow-wrap: anywhere; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; border-bottom: 2px solid transparent; }
.tab svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--gold); }
.tab:focus-visible, .iconbtn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.body { overflow-y: auto; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 14px; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.cap, .grp > .lab { font: 600 10.5px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; gap: 6px; }
.seg label { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 9px; cursor: pointer; }
.seg label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.seg input { margin: 2px 0 0; accent-color: var(--accent); grid-row: span 2; }
.seg b { font: 700 13px var(--display); }
.stratiosel { margin: 2px 0 6px; } .stratiosel label { border-style: dashed; }
.stlistsel { gap: 4px; } .stlistsel label { padding: 6px 10px; } .stlistsel input { grid-row: auto; }
.strat { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; margin: 6px 0 4px; } .strat select { min-width: 0; padding: 6px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper, #fff); color: inherit; font: inherit; font-size: 12.5px; }
#legend li.stbars { display: block; } .stbar { display: grid; grid-template-columns: 12px minmax(84px, 1.1fr) 1fr 36px; gap: 6px; align-items: center; margin: 3px 0; font-size: 12.5px; }
.stbar > i { width: 12px; height: 12px; border-radius: 3px; } .stbar .stl small { display: block; opacity: .65; font-size: 11px; } .stb { height: 10px; background: color-mix(in srgb, currentColor 8%, transparent); border-radius: 5px; overflow: hidden; } .stb b { display: block; height: 100%; border-radius: 5px; } .stp { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
#legend li.stkpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .stkpi div { display: grid; gap: 2px; padding: 8px; border: 1px solid var(--rule); border-radius: 9px; } .stkpi b { font: 700 22px var(--display); } .stkpi span { font-size: 11.5px; opacity: .8; }
#legend li.stlist { display: grid; gap: 3px; } .stu { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 7px; background: none; color: inherit; font: inherit; font-size: 12.5px; cursor: pointer; text-align: left; } .stu:hover { border-color: var(--accent); }
.stlist.bad .stu { border-left: 4px solid #c0272d; } .stlist.good .stu { border-left: 4px solid #1f8a4c; }
.stempty { margin: 6px 0; } .stempty small { display: block; opacity: .7; font-size: 11.5px; margin-top: 2px; }
table.stpt { border-collapse: collapse; margin: 6px 0; font-size: 12.5px; } table.stpt td { padding: 3px 6px 3px 0; vertical-align: top; }
.gcoef { display: grid; gap: 6px; margin: 6px 0; } .gcoef > div { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; } .gcoef small { grid-column: 1 / 3; opacity: .75; } .gcoef label, .gcoef > div > b { grid-row: 1 / span 2; grid-column: 3; display: flex; align-items: center; gap: 2px; } .gcoef input { width: 52px; padding: 4px; border: 1px solid var(--rule); border-radius: 6px; background: transparent; color: inherit; }
.gtag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11.5px; font-weight: 700; color: #fff; white-space: nowrap; } .gtag.ga { background: #1f8a4c; } .gtag.gs { background: #7d9f2c; } .gtag.gn { background: #8a7a55; }
.glist { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 2px; max-height: 320px; overflow: auto; } .glist li { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--rule); }
.glist small { grid-column: 1; opacity: .7; font-size: 11px; } .glist select, .glist .gtag { grid-row: 1 / span 2; grid-column: 2; } .glist select { font-size: 12px; padding: 3px; border-radius: 6px; max-width: 150px; } .glink { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; }
.stpill { display: inline-block; min-width: 28px; text-align: center; color: #fff; border-radius: 6px; padding: 0 5px; font-size: 12px; }
.seg.jobcol { grid-template-columns: 1fr 1fr; } .seg.jobcol label { padding: 6px 8px; align-items: center; } .seg.jobcol input { grid-row: auto; margin: 0; }
.seg small { color: var(--muted); font-size: 11.5px; grid-column: 2; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.row2 label { padding: 7px 9px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; }
.check input { accent-color: var(--accent); }
select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--fg); font: 13px var(--body); }
#legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12.5px; }
#legend li { display: flex; align-items: center; gap: 8px; }
#legend li.cap { margin-top: 4px; }
#legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
#legend input { accent-color: var(--accent); margin: 0; }
#legend i { width: 16px; height: 12px; border-radius: 3px; flex: none; border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); }
#legend i.ln { height: 0; border: 0; border-top: 3px solid; border-radius: 0; width: 22px; }
#legend i.ln.thick { border-top-width: 5px; }
#legend i.ln.dash { border-top-style: dashed; }
#legend i.ln.dot { border-top-style: dotted; border-top-width: 4px; }
#info { border-top: 1px solid var(--rule); padding-top: 12px; }
#info h3 { font: 800 18px/1.15 var(--display); margin: 4px 0 8px; text-wrap: balance; }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
#info dt { color: var(--muted); }
#info dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
#info .src { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 10px 0 0; }
.chip { display: inline-block; font: 600 10px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); border: 1px solid currentColor; border-radius: 99px; padding: 2px 8px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi span { font-size: 11.5px; color: var(--muted); }
.kpi b { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); }
.hint { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
.rchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.rchip { color: #fff; font: 700 11px var(--display); padding: 2px 6px; border-radius: 5px; }
details.about { font-size: 12px; color: var(--muted); }
details.about summary { cursor: pointer; font-weight: 600; color: var(--fg); }
details.about p { margin: 6px 0 0; line-height: 1.5; }

.lbl { pointer-events: none; text-align: center; font: 700 12px/1.1 var(--display); color: var(--fg); white-space: nowrap;
  text-shadow: 0 0 3px var(--map-bg), 0 0 3px var(--map-bg), 0 0 6px var(--map-bg); }
.lbl small { display: block; font: 600 10.5px var(--body); color: var(--accent); font-variant-numeric: tabular-nums; }
.lbl-1 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
.lbl .dir { display: block; font: 600 11px var(--body); font-style: normal; letter-spacing: .04em; text-transform: none; opacity: .8; }
.lbl-3 { font-size: 11px; font-weight: 600; }
.lbl-ctx { color: var(--muted); font-style: italic; font-weight: 500; }
.lbl-img { color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 6px #000; }
.lbl-img.lbl-ctx { color: #e9ecef; }
body:not(.ready) #info::after { content: "…"; }


#toolbar { position: absolute; z-index: 6; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(56px + env(safe-area-inset-right, 0px));
  display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
.tbtn { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--fg); padding: 7px 10px; border-radius: 8px; font: 600 12px var(--body); cursor: pointer; }
.asearch { position: relative; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 5%, transparent); }
.asearch > svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; opacity: .6; }
.asearch input { width: 230px; border: 0; background: transparent; color: var(--fg); font: 500 13px var(--body); padding: 7px 2px; outline: none; }
.asearch input::-webkit-search-cancel-button { display: none; }
#toolbar:has(.asres:not([hidden])) { z-index: 80; }
.asx { border: 0; background: none; color: var(--fg); font-size: 18px; line-height: 1; cursor: pointer; opacity: .6; padding: 0 4px; }
.asres { position: absolute; top: calc(100% + 8px); left: -4px; width: 340px; max-height: 60vh; overflow: auto; margin: 0; padding: 6px; list-style: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); z-index: 9; }
.asres .hit { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--fg); padding: 7px 8px; border-radius: 8px; cursor: pointer; font: inherit; }
.asres .hit .small { grid-column: 1; opacity: .7; } .asres .hit .hd { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; opacity: .75; }
.asres .hit:hover, .asres .hit.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
.tbtn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tbtn[aria-pressed="true"], .tbtn[aria-expanded="true"] { background: var(--accent); color: var(--surface); }
.pop { position: absolute; z-index: 7; right: calc(56px + env(safe-area-inset-right, 0px)); top: calc(62px + env(safe-area-inset-top, 0px)); width: 280px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.basegrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.basegrid label { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-align: center; }
.basegrid input { position: absolute; opacity: 0; pointer-events: none; }
.sw { width: 52px; height: 40px; border-radius: 8px; border: 2px solid var(--rule); display: block; }
.basegrid input:checked + .sw { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.basegrid input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw-std { background: linear-gradient(135deg, #f1d6d8 0 30%, #b9dfb0 30% 55%, #ecebb8 55% 80%, #a9cfee 80%); }
.sw-simple { background: linear-gradient(160deg, #f4f2ee 0 60%, #fff 60% 64%, #f4f2ee 64% 85%, #a9cfee 85%); }
.sw-sat { background: radial-gradient(circle at 30% 40%, #6f7d52, #3d4a33 60%, #2b3a2f); }
.sw-elev { background: linear-gradient(135deg, #407850, #bed078 40%, #d7aa64 70%, #8c5f46); }
.small { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.45; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 7px 12px; font: 600 12.5px var(--body); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 11.5px; }
.btn:focus-visible, .tbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
#elevread { position: absolute; z-index: 4; left: calc(370px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); color: var(--fg);
  border: 1px solid var(--rule); border-radius: 8px; padding: 4px 9px; font: 600 12px var(--body); font-variant-numeric: tabular-nums; box-shadow: var(--shadow); }
.measure { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 10px; }
.measure div { border: 1px solid var(--rule); border-radius: 9px; padding: 7px 9px; }
.measure span { display: block; font-size: 11px; color: var(--muted); }
.measure b { font: 800 17px var(--display); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12.5px; margin: 8px 0 0; }
.stats dt { color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.stats .sep { grid-column: 1 / -1; font: 600 10.5px var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.stats img { width: 14px; height: 14px; }
.loading { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--accent); animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.poipop img.ph { width: 100%; max-height: 170px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; display: block; }
.poipop .phph { height: 150px; background: var(--rule); border-radius: 8px; margin-bottom: 6px; }
.poipop img.ph { height: 150px; }
.poipop .k { color: var(--muted); font-size: 11.5px; }
.poipop .sel { user-select: all; word-break: break-all; font-size: 11.5px; }
#legend img { width: 18px; height: 18px; flex: none; }
.note { font-size: 11.5px; color: var(--gold); margin: 6px 0 0; }

.datebox { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; color: var(--fg); }
.datebox svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; flex: none; }
.datebox input { border: 1px solid var(--rule); background: var(--surface); color: var(--fg); border-radius: 7px; padding: 5px 6px; font: 600 12.5px var(--body); font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tsep { width: 1px; background: var(--rule); margin: 4px 2px; }
.tbtn.sm { padding: 6px 9px; color: var(--accent); }
.tbtn.plan { position: relative; color: var(--muted); }
.tbtn.plan .tip { display: none; position: absolute; top: calc(100% + 8px); right: 0; width: 200px; background: var(--fg); color: var(--surface); font: 500 11.5px/1.4 var(--body); padding: 6px 9px; border-radius: 7px; text-align: left; z-index: 9; }
.tbtn.plan:hover .tip, .tbtn.plan:focus-visible .tip { display: block; }
.seg.row3 { grid-template-columns: 1fr 1fr 1fr; }
.seg.row3 label { padding: 7px 8px; }
.seg.row3 small { font-size: 10.5px; }
.ramp { display: block; height: 10px; border-radius: 5px; width: 100%; min-width: 150px; }
.heatramp { background: linear-gradient(90deg, #2c7bb6, #00a6ca, #90eb9d, #f9d057, #f29e2e, #d7191c); }
.elevramp { background: linear-gradient(90deg, #313695, #4575b4 15%, #74add1 27%, #abd9e9 40%, #fee090 52%, #fdae61 64%, #f46d43 76%, #d73027 89%, #a50026); }
.rampl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
#legend li:has(.ramp) { display: block; }
#elevlegend { position: absolute; z-index: 4; right: calc(130px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 230px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 10px; box-shadow: var(--shadow); display: grid; gap: 4px; font: 600 11.5px var(--body); }
#elevlegend[hidden] { display: none; }
.budget { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font: 700 13.5px var(--display); }
.pill { font: 600 10.5px var(--body); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
